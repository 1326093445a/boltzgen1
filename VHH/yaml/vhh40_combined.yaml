# JN.1 RBD x all 40 VHH frameworks in ONE design spec.
# Each design independently picks one scaffold at random (schema.py:1946-1949,
# random.choice over the path list), then that scaffold's own YAML supplies its
# per-framework CDR ranges and native-anchored insertion ranges.
#
# --num_designs is the TOTAL here (one input spec), unlike the 40-spec form where
# it is per framework. Use --num_designs 300000.
entities:
  - file:
      path: ../pdb/Target/JN1_RBD_clean.pdb
      include:
        - chain:
            id: T
      binding_types:
        - chain:
            id: T
            binding: 158,159,161,164,166,167

